# Builds and tests IncreArt on Linux, Windows and macOS, and keeps each
# platform's release build as a downloadable artifact. Windows runs the
# tests twice more with libraries on hard links and on copies (what most
# Windows installs and the Windows example library use; the runner itself
# can make symlinks).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# a newer push to the same branch (or PR) cancels the run it supersedes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}${{ matrix.link_mode && format(', {0}', matrix.link_mode) || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-latest
          - os: windows-latest
            link_mode: hardlink
          - os: windows-latest
            link_mode: copy
    runs-on: ${{ matrix.os }}
    env:
      INCREART_LINK_MODE: ${{ matrix.link_mode }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev
      # one cache per OS (the Windows jobs share a key), saved by the job
      # that builds everything, so the link-mode runs can't save a partial one
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ !matrix.link_mode }}
      - if: ${{ !matrix.link_mode }}
        run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast
      - name: The server validation suite, against servers it starts (the fake sd-server)
        if: ${{ !matrix.link_mode }}
        run: |
          cargo clippy -p increart-apitest --all-targets --features fake -- -D warnings
          cargo test -p increart-apitest --features fake
      - if: ${{ !matrix.link_mode }}
        run: cargo build --release -p increart-gui
      - name: The example library, as releases ship it
        # its links as stand-ins: opened, every link and image is intact
        if: ${{ !matrix.link_mode }}
        shell: bash
        run: |
          scripts/stage-example-library.sh "$RUNNER_TEMP/Example library"
          target/release/increart --check-library "$RUNNER_TEMP/Example library"
          cat "$RUNNER_TEMP/Example library/library.rsn"
      - if: ${{ !matrix.link_mode }}
        uses: actions/upload-artifact@v7
        with:
          name: increart-${{ runner.os }}
          path: target/release/increart${{ runner.os == 'Windows' && '.exe' || '' }}
