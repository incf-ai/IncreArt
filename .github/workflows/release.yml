# On a version tag (v*, or v*-rc<n> for a pre-release that tries the
# pipeline out), builds IncreArt for Linux, Windows and macOS and
# publishes one portable zip per platform to that tag's release. Each zip
# holds the app, the README and licence, and the example library
# (example-library/; see scripts/update-example-library.sh), which the app
# offers in its startup list on first run.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # the app against a real KoboldCpp on each OS first
  koboldcpp:
    uses: ./.github/workflows/koboldcpp-cpu.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}

  build:
    needs: koboldcpp
    strategy:
      fail-fast: false
      matrix:
        include:
          # the oldest supported runner: the binary needs the build's glibc
          # or newer, so it runs on Ubuntu 22.04+, Debian 12+ and the like
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
          - os: macos-latest
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      - name: Tag matches the version
        run: |
          version=$(sed -nE 's/^version = "(.*)"/\1/p' crates/increart-gui/Cargo.toml | head -1)
          # v<version>, or v<version>-rc<n> for a trial run of the pipeline
          [[ $TAG == "v$version" || $TAG =~ ^v${version//./\\.}-rc[0-9]+$ ]] \
            || { echo "tag $TAG, but increart-gui is version $version" >&2; exit 1; }
          # the suite ships with the app, at its version
          grep -qx "version = \"$version\"" crates/increart-apitest/Cargo.toml \
            || { echo "increart-apitest isn't at version $version" >&2; exit 1; }
      - run: cargo build --release --locked -p increart-gui -p increart-apitest
      - name: Version line
        run: |
          v=$(target/release/increart --version)
          echo "$v"
          [[ $v != *-dirty* ]] || { echo "built from a dirty tree" >&2; exit 1; }
      - name: Example library
        # each link as its stand-in (see the script)
        run: mkdir -p dl && scripts/stage-example-library.sh "dl/Example library"
      - name: Package
        id: package
        run: |
          name="increart-${TAG}-${{ matrix.platform }}"
          mkdir -p "stage/$name"
          ext=${{ runner.os == 'Windows' && '.exe' || '' }}
          # the app and its server validation suite (Validate servers…)
          cp "target/release/increart$ext" "target/release/increart-apitest$ext" README.md LICENSE "stage/$name/"
          mv "dl/Example library" "stage/$name/"
          # zip keeps the executable bit
          if [[ $RUNNER_OS == Windows ]]; then (cd stage && 7z a -tzip "../$name.zip" "$name" > /dev/null)
          else (cd stage && zip -qr -y -X "../$name.zip" "$name"); fi
          echo "zip=$name.zip" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: The zip works
        # unzipped fresh, as a user would: the app runs and finds every link,
        # image and recipe of the example library intact, and nothing in it
        # to generate (it would be queued on a model the user may not have)
        run: |
          rm -rf smoke && mkdir smoke
          if [[ $RUNNER_OS == Windows ]]; then 7z x -y -osmoke "${{ steps.package.outputs.zip }}" > /dev/null
          else unzip -q "${{ steps.package.outputs.zip }}" -d smoke; fi
          dir="smoke/${{ steps.package.outputs.name }}"
          "$dir/increart" --version
          "$dir/increart-apitest" --version
          # the suite lists its cases for a server, without asking it anything
          "$dir/increart-apitest" list --url http://127.0.0.1:9 --kind sd-server | grep -q 'url/sd-server/connect.capabilities'
          report=$("$dir/increart" --check-library "$dir/Example library") || { echo "$report"; exit 1; }
          echo "$report"
          if grep -q 'seeds to generate' <<<"$report"; then echo "the example library has runs to generate" >&2; exit 1; fi
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # an -rc tag: a pre-release, never shown as the latest
          pre=(); [[ $TAG == *-rc* ]] && pre=(--prerelease --latest=false)
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes "${pre[@]}" || true
          gh release upload "$TAG" --clobber "${{ steps.package.outputs.zip }}"
