# File access goes through increart_core::vfs, which serves an ephemeral
# library from RAM (DESIGN.md, Ephemeral mode). These go round it.
disallowed-methods = [
    { path = "std::fs::read", reason = "use vfs" },
    { path = "std::fs::read_to_string", reason = "use vfs" },
    { path = "std::fs::write", reason = "use vfs" },
    { path = "std::fs::copy", reason = "use vfs" },
    { path = "std::fs::rename", reason = "use vfs" },
    { path = "std::fs::create_dir", reason = "use vfs" },
    { path = "std::fs::create_dir_all", reason = "use vfs" },
    { path = "std::fs::remove_file", reason = "use vfs" },
    { path = "std::fs::remove_dir", reason = "use vfs" },
    { path = "std::fs::remove_dir_all", reason = "use vfs" },
    { path = "std::fs::read_dir", reason = "use vfs" },
    { path = "std::fs::metadata", reason = "use vfs" },
    { path = "std::fs::symlink_metadata", reason = "use vfs" },
    { path = "std::fs::read_link", reason = "use vfs" },
    { path = "std::fs::canonicalize", reason = "use vfs" },
    { path = "std::fs::hard_link", reason = "use vfs" },
    { path = "std::fs::exists", reason = "use vfs" },
    { path = "std::fs::set_permissions", reason = "use vfs" },
    { path = "std::fs::File::open", reason = "use vfs::File" },
    { path = "std::fs::File::create", reason = "use vfs::File" },
    { path = "std::fs::OpenOptions::open", reason = "use vfs::OpenOptions" },
    { path = "std::os::unix::fs::symlink", reason = "use vfs::symlink" },
    { path = "std::path::Path::exists", reason = "use vfs::exists" },
    { path = "std::path::Path::try_exists", reason = "use vfs::try_exists" },
    { path = "std::path::Path::is_dir", reason = "use vfs::is_dir" },
    { path = "std::path::Path::is_file", reason = "use vfs::is_file" },
    { path = "std::path::Path::is_symlink", reason = "use vfs::symlink_metadata" },
    { path = "std::path::Path::metadata", reason = "use vfs::metadata" },
    { path = "std::path::Path::symlink_metadata", reason = "use vfs::symlink_metadata" },
    { path = "std::path::Path::read_dir", reason = "use vfs::read_dir" },
    { path = "std::path::Path::read_link", reason = "use vfs::read_link" },
    { path = "std::path::Path::canonicalize", reason = "use vfs::canonicalize" },
    { path = "image::open", reason = "use vfs::open_image" },
    { path = "image::ImageReader::open", reason = "read through vfs" },
    { path = "image::image_dimensions", reason = "use vfs::image_dimensions" },
]
