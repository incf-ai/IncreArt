[package]
name = "increart-apitest"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Validates the servers of an IncreArt config: each call the app makes, one test case at a time"

[features]
# The stand-in sd-server below (tests and CI; not in releases).
fake = ["dep:tiny_http"]

[dependencies]
base64 = "0.22"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
increart-core = { version = "0.1.0", path = "../increart-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny_http = { version = "0.12.0", optional = true }
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
tempfile = "3.27.0"
tiny_http = "0.12.0"

[[bin]]
name = "increart-apitest"
path = "src/main.rs"

# sd-server's API, faked (increart-core's test fake) on --listen-port, as
# a server the suite starts: `cargo build --features fake`.
[[bin]]
name = "increart-fake-sd-server"
path = "src/bin/fake-sd-server.rs"
required-features = ["fake"]
test = false
doc = false
