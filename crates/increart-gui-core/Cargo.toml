[package]
name = "increart-gui-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
avif = ["increart-core/avif"]

[dependencies]
ab_glyph = "0.2.32"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
increart-core = { version = "0.1.0", path = "../increart-core" }
epaint_default_fonts = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
notify = "8.2"
serde_json = "1.0.154"
similar = "2"

[dev-dependencies]
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2"] }
tempfile = "3.27.0"
tiny_http = "0.12.0"
serde_json = "1.0.154"
